[access]
# Laisser vide pour utiliser le fournisseur OIDC par defaut configure dans [auth].
# Mettre "microsoft" si la configuration est dans [auth.microsoft].
oidc_provider = ""

# Seules ces adresses peuvent entrer avec OIDC.
allowed_emails = [
  "direction@dbau.example",
]

# Les administrateurs peuvent importer, exporter, reallouer et reinitialiser.
admin_emails = [
  "direction@dbau.example",
]

# Mot de passe de secours, a stocker uniquement dans les secrets Streamlit Cloud.
emergency_password = "A_REMPLACER_PAR_UN_MOT_DE_PASSE_LONG"

[auth]
redirect_uri = "https://gb-dbau.streamlit.app/oauth2callback"
cookie_secret = "A_REMPLACER_PAR_UNE_CHAINE_ALEATOIRE_LONGUE"

# Exemple Google Workspace.
# client_id = "..."
# client_secret = "..."
# server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# Exemple Microsoft Entra ID.
# Decommenter cette section et mettre oidc_provider = "microsoft" dans [access].
# [auth.microsoft]
# client_id = "..."
# client_secret = "..."
# server_metadata_url = "https://login.microsoftonline.com/TENANT_ID/v2.0/.well-known/openid-configuration"

